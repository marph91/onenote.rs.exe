on:
  push:
  workflow_dispatch:

# https://docs.github.com/en/actions/tutorials/build-and-test-code/rust
jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # needed for release
    strategy:
      fail-fast: false
      matrix:
        # "ubuntu-22.04" to cover linux with older glibc
        os: ["windows-latest", "ubuntu-22.04", "macos-latest", "macos-15-intel"]
    env:
      OS: ${{ matrix.os }}  # TODO: Is there a built-in env variable?
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build onenote-parse executable
        working-directory: ./repos/onenote.rs
        shell: bash
        run: cargo build --release --bins
      - name: Build one2html executable
        working-directory: ./repos/one2html
        shell: bash
        # use --no-default-features as suggested in https://github.com/msiemens/one2html/issues/13#issuecomment-1839161117
        run: cargo build --release --features bin,onepkg --no-default-features
      - name: Prepare executables for release
        shell: bash
        run: |
          bash copy_and_add_os_suffix.bash ./repos/onenote.rs/target/release/onenote-parse
          bash copy_and_add_os_suffix.bash ./repos/one2html/target/release/one2html
      - name: Output debug information
        shell: bash
        run: |
          rustup --version
          ls -lh binaries/
      - name: Release onenote-parse
        uses: softprops/action-gh-release@v2
        # release only if there is a matching release tag
        if: ${{ startsWith(github.ref, 'refs/tags/onenote-parse-v') }}
        with:
          files: ./binaries/onenote-parse-*
      - name: Release one2html
        uses: softprops/action-gh-release@v2
        # release only if there is a matching release tag
        if: ${{ startsWith(github.ref, 'refs/tags/one2html-v') }}
        with:
          files: ./binaries/one2html-*
      - name: Smoke test
        shell: bash
        run: |
          ./binaries/onenote-parse-* ./repos/onenote.rs/crates/parser/tests/samples/New\ Section\ 1.one | tail
          ./binaries/one2html-* --input ./repos/onenote.rs/crates/parser/tests/samples/New\ Section\ 1.one --output ./binaries
          ./binaries/one2html-* --input ./repos/onenote.rs/crates/parser/tests/samples/Open\ Notebook.onetoc2 --output ./binaries
          ls -lhR ./binaries
