on:
  push:
  workflow_dispatch:

# https://docs.github.com/en/actions/tutorials/build-and-test-code/rust
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["windows-latest", "ubuntu-latest", "macos-latest", "macos-15-intel"]
    env:
      OS: ${{ matrix.os }}  # TODO: Is there a built-in env variable?
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build onenote-parse executable
        working-directory: ./repos/onenote.rs
        shell: bash
        run: cargo build --release --bins
      - name: Prepare executable for release
        shell: bash
        run: bash copy_and_add_os_suffix.bash ./repos/onenote.rs/target/release/onenote-parse
      - name: Output debug information
        shell: bash
        run: |
          rustup --version
          ls -lh binaries/
      - name: Release
        uses: softprops/action-gh-release@v2
        # release only if there is a matching release tag
        if: ${{ startsWith(github.ref, 'refs/tags/onenote-parse-v') }}
        with:
          files: ./binaries/onenote-parse-*
      - name: Smoke test
        shell: bash
        run: |
          ./binaries/onenote-parse-* ./repos/onenote.rs/tests/samples/New\ Section\ 1.one | tail
